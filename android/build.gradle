buildscript {
    ext.kotlin_version = '1.9.20' //2.0.21
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:4.4.2"
        configurations.all {
            exclude group: 'com.mapbox.common', module: 'common'
            exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-android-core'
        }

    }
}

subprojects {
    afterEvaluate {project ->
        if (project.hasProperty('android')) {
            // Get Android extension safely
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                // Safely check if kotlinOptions exists on this extension
                try {
                    androidExt.compileOptions {
                        sourceCompatibility JavaVersion.VERSION_1_8
                        targetCompatibility JavaVersion.VERSION_1_8
                    }
                    if (project.plugins.hasPlugin('kotlin-android')) {
                        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                            kotlinOptions {
                                jvmTarget = "1.8"
                                freeCompilerArgs += ['-Xskip-metadata-version-check']
                            }
                        }
                    }
                } catch (Exception e) {
                    // Log the error but continue with the build
                    println "Warning: Could not apply Kotlin options to ${project.name}: ${e.message}"
                }
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.10.0'
    }
}