buildscript {
    ext.kotlin_version = '1.9.25'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25"
        classpath "com.google.gms:google-services:4.4.2"
        configurations.all {
            exclude group: 'com.mapbox.common', module: 'common'
            exclude group: 'com.mapbox.mapboxsdk', module: 'mapbox-android-core'
        }

    }
}

subprojects {
    afterEvaluate { project ->
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null) {
            try {
                androidExt.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
                if (project.plugins.hasPlugin('kotlin-android')) {
                    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                        kotlinOptions {
                            jvmTarget = "1.8"
                            freeCompilerArgs += ['-Xskip-metadata-version-check']
                        }
                    }
                }
            } catch (Exception e) {
                println "Warning: Could not apply Kotlin options to ${project.name}: ${e.message}"
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.10.0'
    }
}