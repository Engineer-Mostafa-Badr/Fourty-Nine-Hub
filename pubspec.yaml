name: fourtyninehub
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# of the product and file versions while build-number is used as the build suffix.
version: 1.0.17+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
#  agora_rtc_engine: ^6.5.2 # Real-time audio/video via Agora — requires native SDK, not replaceable
  animated_cards_carousel: ^1.0.2 # Animated card carousel — can be replaced using PageView + AnimatedBuilder
  animated_custom_dropdown: ^3.1.1 # Custom animated dropdown — replaceable with Overlay + AnimatedContainer + GestureDetector
  animated_notch_bottom_bar: ^1.0.3 # Animated bottom bar with notch — replaceable with BottomNavigationBar + ClipPath/animations
  app_tracking_transparency: ^2.0.6+1 # iOS tracking permission — native only
  audio_service: ^0.18.18 # Background audio service — requires OS integration, not replaceable
  audio_session: ^0.1.25 # Audio session management — replaceable with Flutter audio setup
  audio_video_progress_bar: ^2.0.3 # Audio/video progress bar — replaceable with Slider/CustomPainter
  audioplayers: ^6.1.0 # Simple audio player — replaceable with just_audio or custom AudioPlayer
  auto_size_text: ^3.0.0 # Auto-resizes text to fit available space — replaceable with FittedBox/LayoutBuilder
  avatar_glow: ^3.0.1 # Glow effect around avatar — replaceable with AnimatedContainer + BoxShadow
  cached_network_image: ^3.3.1 # Cached network image — widely used, not easily replaceable
  camera: ^0.10.6 # Camera access — native plugin required
  card_swiper: ^3.0.1 # Swipeable card stack — replaceable with PageView + GestureDetector + Transform
