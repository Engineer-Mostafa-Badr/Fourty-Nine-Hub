  connectivity_plus: ^6.1.4 # Network connectivity detection — requires native
  country_pickers: ^3.0.1 # Country picker UI — replaceable with custom list/dropdown
  cupertino_icons: ^1.0.6 # iOS icons — can be replaced with custom icons
