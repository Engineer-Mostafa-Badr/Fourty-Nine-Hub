  insta_image_viewer: ^1.0.4 # Image viewer — replaceable with custom page overlay
  intl: null # Internationalization — replaceable with custom logic or intl package
  json_annotation: ^4.8.1 # Codegen annotations — replaceable manually but tedious
  just_audio: ^0.9.46 # Audio playback — replaceable with audioplayers or custom AudioPlayer
  jwt_decoder: null # JWT decoding — replaceable manually
  latlong2: null # Lat/Lng helper — replaceable manually
  liquid_progress_indicator_v2: ^0.5.0 # Animated progress indicator — replaceable with CustomPainter + Animation
  local_auth: ^2.3.0 # Biometric auth — native plugin required
  logger: ^2.6.0 # Logging helpers — replaceable manually
  lottie: ^3.1.2 # Lottie animations — difficult to replace manually
  marquee_text: ^2.5.0+1 # Marquee/scrolling text — replaceable with ScrollController.animateTo or AnimatedBuilder
  multi_dropdown: ^3.0.1 # Multi-dropdown UI — replaceable with custom widgets
  multi_select_flutter: ^4.1.3 # Multi-select UI — replaceable with custom widgets
  native_device_orientation: ^2.0.3 # Device orientation — native plugin required
  open_file: ^3.5.4 # Open files — native plugin required
  open_street_map_search_and_pick: ^0.1.1 # Pick location using OSM — replaceable with custom widget + API
