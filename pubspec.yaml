  firebase_core: ^3.13.0 # Firebase core — required for all Firebase services
  firebase_messaging: ^15.2.5 # Firebase push notifications — requires native setup
  fl_chart: ^0.71.0 # Charts — replaceable with CustomPainter + widgets
  floating_draggable_widget: ^2.3.0 # Draggable floating widget — replaceable using Draggable + Stack
