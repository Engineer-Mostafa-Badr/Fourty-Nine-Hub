  device_info_plus: ^11.3.0 # Device info — requires native plugin
  device_preview: null # Device preview for development — replaceable with custom simulation
  dio: ^5.8.0+1 # Advanced HTTP client — replaceable with http package
  easy_localization: null # Localization helper — replaceable with Flutter intl
  either_dart: ^1.0.0 # Lightweight Either — replaceable manually
  elegant_notification: ^2.3.0 # Notification UI — replaceable with Overlay + custom widgets
  emoji_picker_flutter: any # Emoji picker UI — replaceable with custom grid + search, time-consuming
