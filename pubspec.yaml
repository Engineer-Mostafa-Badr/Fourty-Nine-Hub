  path_drawing: null # Path drawing helpers — replaceable manually
  path_provider: ^2.0.11 # Access system paths — native plugin required
  pdf: ^3.10.0 # Create PDF files — replaceable manually using pdf widgets
  permission_handler: ^11.4.0 # Manage device permissions — native plugin required
  photo_manager: ^3.6.3 # Manage photos/media — native plugin required
  photo_view: null # Photo viewer — replaceable manually
  pin_code_fields: ^8.0.1 # OTP/pin input fields — replaceable with TextFields + FocusNodes + controllers
  pinput: ^5.0.0 # Input fields with PIN — replaceable manually
  pretty_dio_logger: ^1.3.1 # Dio logging — optional, can remove in production
  printing: ^5.11.0 # PDF printing/export — replaceable with platform channels
  quran: ^1.3.1 # Quran text UI — replaceable manually
  readmore: ^3.0.0 # Collapsible "read more" text — replaceable with Text(maxLines) + AnimatedSize
  record: ^5.1.0 # Audio recording — requires native plugin
  restart_app: null # Restart app — replaceable manually
  rxdart: null # Reactive extensions — replaceable manually
  screenshot: null # Screenshot capture — native plugin required
