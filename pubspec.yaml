    sdk: flutter
  flutter_animate: ^4.5.0 # Animation chaining library — replaceable with AnimationController + Tween + AnimatedBuilder
  flutter_background_service: ^5.0.10 # Background service — native integration required
  flutter_bloc: ^9.1.1 # State management — replaceable with Streams/ChangeNotifier
  flutter_cache_manager: ^3.3.3 # File caching — replaceable manually
  flutter_card_swiper: ^7.0.1 # Card swiper — can replace with PageView + GestureDetector + Transform
  flutter_contacts: ^1.1.9+2 # Access device contacts — requires native plugin
  flutter_countdown_timer: ^4.1.0 # Countdown timer widget — replaceable with Timer + AnimatedBuilder
  flutter_date_pickers: null # Date picker widgets — replaceable with showDatePicker
  flutter_emoji: null # Emoji handling — replaceable with custom list/grid
  flutter_facebook_auth: ^7.1.2 # Facebook login — requires native SDK
  flutter_fortune_wheel: ^1.3.1 # Fortune wheel widget — replaceable with CustomPainter + GestureDetector
  flutter_image_compress: null # Image compression — native plugin required
  flutter_local_notifications: ^19.2.0 # Local notifications — native integration required
  flutter_map: null # Leaflet map — native plugin required
  flutter_markdown: ^0.7.7+1 # Markdown rendering — replaceable with RichText + parsing
  flutter_osm_plugin: ^1.4.2 # OpenStreetMap — native integration required
  flutter_pdfview: ^1.3.4 # PDF viewer — native plugin required
  flutter_phoenix: null # Restart app programmatically — replaceable using StatefulWidget + keys
  flutter_polyline_points: ^2.1.0 # Polyline points for maps — replaceable manually
  flutter_rating: ^2.0.2 # Star rating widget — replaceable with row of IconButtons
  flutter_rating_bar: null # Rating bar — replaceable with row of IconButtons
  flutter_reaction_button: ^3.0.0+3 # Reaction popup buttons — replaceable using Overlay + GestureDetector + animation
  flutter_screenutil: ^5.9.3 # Responsive sizing — replaceable with MediaQuery/LayoutBuilder
