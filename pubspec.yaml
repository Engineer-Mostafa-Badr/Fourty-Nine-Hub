  flutter_slidable: ^4.0.0 # Swipeable actions on list items — partially replaceable with Dismissible/GestureDetector
  flutter_spinkit: ^5.2.1 # Loading spinners — replaceable with ProgressIndicator or AnimatedBuilder
  flutter_staggered_grid_view: ^0.7.0 # Staggered/masonry grids — replaceable with CustomScrollView + SliverGrid
  flutter_svg: ^2.0.10+1 # SVG rendering — replaceable with custom painting
  flutter_typeahead: null # Autocomplete — replaceable with Overlay + TextField logic
  flutter_video_thumbnail_plus: ^1.0.5 # Extract video thumbnails — replaceable with custom video processing
  fluttertoast: null # Toast messages — replaceable with SnackBar or Overlay
  font_awesome_flutter: ^10.7.0 # FontAwesome icons — replaceable with custom icons
  geocode: null # Convert address to coordinates — replaceable using API
  geocoding: ^3.0.0 # Forward/reverse geocoding — replaceable with HTTP API calls
  geocoding_resolver: null # Helper layer for geocoding — replaceable manually
  geolocator: null # GPS location — requires native setup
  get_it: ^8.0.3 # Service locator — replaceable manually
  giphy_get: ^3.6.0 # Giphy GIF picker — replaceable with custom grid + API
  go_router: ^15.1.2 # Routing — replaceable with Navigator 2.0 or custom routing
  google_fonts: null # Google fonts — replaceable with local fonts
  google_maps_flutter: ^2.6.1 # Google Maps — requires native API key
  google_mobile_ads: ^6.0.0 # Ads integration — requires native SDK
  google_places_flutter: ^2.1.0 # Places autocomplete — depends on Google SDK
  google_sign_in: ^6.1.0 # Google login — requires native SDK
