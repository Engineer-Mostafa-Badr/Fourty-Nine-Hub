  shared_preferences: ^2.0.6 # Key-value storage — replaceable with custom logic
  shimmer: ^3.0.0 # Shimmer placeholders — replaceable with ShaderMask + gradient animation
  sign_in_with_apple: ^7.0.1 # Apple login — iOS native setup required
