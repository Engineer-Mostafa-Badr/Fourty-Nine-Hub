  ntp: ^2.0.0 # Network time — replaceable via HTTP NTP requests
  app_settings: ^5.1.1 # Open system settings — native only
  bottom_picker: ^4.1.1
dependency_overrides:
  camera_android_camerax: 0.6.10+1
  record_linux: ^1.1.1
  http: ^0.13.3
  text_scroll: null
  auto_scroll_text: null
  flutter_date_pickers: null
  web: ^1.0.0
  #  webview_flutter_android: ^3.13.1
  #  web: ^1.0.0
  shared_preferences_android: 2.4.11
  # Resolve intl version conflict for 16 KB page size compatibility
  intl: 0.20.2
  # Resolve package_info_plus version conflict
  package_info_plus: ^8.0.2
  # Resolve vibration version conflict - use newer version without v1 embedding
  vibration: ^3.1.4
  # Fix floating package compatibility
  floating: ^6.0.0
  # Force permission_handler version to resolve flutter_osm_plugin conflict
  permission_handler: ^12.0.0+1

#  wakelock_plus: ^1.2.8
dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: null
  flutter_test:
    sdk: flutter
  json_serializable: ^6.7.1
  widgetbook_generator: ^3.13.0

icons_launcher:
  image_path: "assets/images/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
flutter:
  uses-material-design: true
