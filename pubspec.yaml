  toastification: ^3.0.3 # Toast notifications — replaceable with Overlay + SnackBar
  top_snackbar_flutter: ^3.1.0 # Top snackbar UI — replaceable manually
  transparent_image: ^2.0.1 # Transparent placeholder image — replaceable manually
  url_launcher: ^6.3.1 # Launch URLs/calls/email — requires native support
  vertical_card_pager: ^1.6.3 # Vertical card pager — replaceable using vertical PageView + custom animation
  vibration: ^1.8.4 # Vibration — native plugin required
  video_compress: ^3.1.4 # Video compression — native plugin needed
  video_player: ^2.8.2 # Core video player — requires native integration
  visibility_detector: ^0.4.0+2 # Visibility detection — replaceable manually
  voice_message_package: ^2.2.1 # Voice message UI & recording — native plugin required
