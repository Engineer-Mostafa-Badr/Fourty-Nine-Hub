  snapping_bottom_sheet: ^1.0.4 # Bottom sheet snapping — replaceable with DraggableScrollableSheet
  social_media_recorder: ^1.1.13 # Short media recorder — requires native plugin
  socket_io_client: ^3.1.2 # Socket.IO client — replaceable with WebSocket
  sqflite: ^2.3.3+1 # Local SQLite DB — native plugin required
